name: boncosmeter
description: A simple budgeting app with SQLite login/register
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # SQLite database
  sqflite: ^2.3.0
  path: ^1.9.0

  # State management (opsional, jika mau ditambah di masa depan)
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
